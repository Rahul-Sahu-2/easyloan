<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile – EasyLone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Navbar -->
  <nav class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="homepage.html" class="text-2xl font-bold text-blue-600">EasyLone</a>
      <div class="flex items-center gap-5 text-sm">
        <a href="offers.html" class="hover:text-blue-600">Offers</a>
        <a href="my-applications.html" class="hover:text-blue-600">My Applications</a>
        <a href="profile.html" class="text-blue-600 font-medium">Profile</a>
      </div>
    </div>
  </nav>

  <!-- Header -->
  <section class="bg-white border-b">
    <div class="max-w-4xl mx-auto px-4 py-8">
      <h1 class="text-2xl md:text-3xl font-bold mb-2">My Profile</h1>
      <p class="text-gray-600">Manage your personal information and preferences.</p>
    </div>
  </section>

  <!-- Profile Content -->
  <div class="max-w-4xl mx-auto px-4 py-10">

    <div class="bg-white rounded-xl border border-gray-200 p-6 md:p-8">

      <!-- Profile Header -->
      <div class="flex flex-col md:flex-row items-center gap-6 mb-8 pb-8 border-b">
        <div class="w-24 h-24 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 text-3xl font-bold">
          RK
        </div>
        <div class="text-center md:text-left">
          <h2 class="text-xl font-bold">Rahul Kumar</h2>
          <p class="text-gray-500 text-sm">Member since October 2026</p>
          <button class="mt-3 text-sm text-blue-600 hover:underline">Change Photo</button>
        </div>
      </div>

      <!-- Personal Information Form -->
      <form class="space-y-6">
        <h3 class="text-lg font-semibold mb-4">Personal Information</h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Full Name -->
          <div>
            <label class="block text-sm font-medium mb-1">Full Name</label>
            <input type="text" value="Rahul Kumar"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <!-- Mobile -->
          <div>
            <label class="block text-sm font-medium mb-1">Mobile Number</label>
            <input type="tel" value="9876543210"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <!-- Email -->
          <div>
            <label class="block text-sm font-medium mb-1">Email Address</label>
            <input type="email" value="rahul.kumar@email.com"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <!-- Date of Birth -->
          <div>
            <label class="block text-sm font-medium mb-1">Date of Birth</label>
            <input type="date" value="1995-06-15"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <!-- City -->
          <div>
            <label class="block text-sm font-medium mb-1">City</label>
            <input type="text" value="Mumbai"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <!-- Pincode -->
          <div>
            <label class="block text-sm font-medium mb-1">Pincode</label>
            <input type="text" value="400001"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <!-- Employment Section -->
        <div class="pt-6 border-t">
          <h3 class="text-lg font-semibold mb-4">Employment Details</h3>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-medium mb-1">Employment Type</label>
              <select class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option>Salaried</option>
                <option>Self-Employed</option>
                <option>Business Owner</option>
              </select>
            </div>

            <div>
              <label class="block text-sm font-medium mb-1">Monthly Income (₹)</label>
              <input type="number" value="65000"
                class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
              <label class="block text-sm font-medium mb-1">Company / Business Name</label>
              <input type="text" value="Tech Solutions Pvt Ltd"
                class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>
        </div>

        <!-- Save Button -->
        <div class="pt-6 flex justify-end gap-4">
          <button type="button" class="px-6 py-3 border border-gray-300 rounded-lg font-medium hover:bg-gray-50 transition">
            Cancel
          </button>
          <button type="submit" class="px-6 py-3 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition">
            Save Changes
          </button>
        </div>
      </form>

    </div>

    <!-- Account Actions -->
    <div class="mt-8 bg-white rounded-xl border border-gray-200 p-6">
      <h3 class="text-lg font-semibold mb-4">Account Settings</h3>
      <div class="space-y-3">
        <a href="#" class="block text-blue-600 hover:underline text-sm">Change Password</a>
        <a href="#" class="block text-blue-600 hover:underline text-sm">Download My Data</a>
        <a href="#" class="block text-red-600 hover:underline text-sm">Delete Account</a>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <footer class="bg-gray-900 text-gray-400 py-8 mt-10">
    <div class="max-w-6xl mx-auto px-4 text-center text-sm">
      <p>© 2026 EasyLone. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
