<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Eligibility – EasyLone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Navbar -->
  <nav class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="homepage.html" class="text-2xl font-bold text-blue-600">EasyLone</a>
      <a href="apply.html" class="bg-blue-600 text-white px-5 py-2.5 rounded-lg text-sm font-semibold hover:bg-blue-700 transition">
        Apply Now
      </a>
    </div>
  </nav>

  <!-- Header -->
  <section class="bg-white border-b">
    <div class="max-w-3xl mx-auto px-4 py-10 text-center">
      <h1 class="text-3xl font-bold mb-3">Check Your Loan Eligibility</h1>
      <p class="text-gray-600">Answer a few simple questions. This is a soft check and will <strong>not</strong> affect your CIBIL score.</p>
    </div>
  </section>

  <!-- Form -->
  <div class="max-w-3xl mx-auto px-4 py-10">
    <div class="bg-white rounded-xl border border-gray-200 p-6 md:p-8">

      <form class="space-y-6">
        <div>
          <label class="block text-sm font-medium mb-1">What type of loan do you need?</label>
          <select class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Select loan type</option>
            <option>Personal Loan</option>
            <option>Home Loan</option>
            <option>Car Loan</option>
            <option>Business Loan</option>
            <option>Education Loan</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Loan Amount Needed (₹)</label>
          <input type="number" placeholder="e.g. 500000"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Employment Type</label>
          <select class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Select</option>
            <option>Salaried</option>
            <option>Self-Employed</option>
            <option>Business Owner</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Monthly Income (₹)</label>
          <input type="number" placeholder="e.g. 45000"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Existing Monthly EMIs (₹)</label>
          <input type="number" placeholder="Enter 0 if none"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="pt-4">
          <button type="button" onclick="checkEligibility()"
            class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition">
            Check Eligibility
          </button>
        </div>
      </form>

      <!-- Result Box (Hidden by default) -->
      <div id="result" class="hidden mt-8 p-5 rounded-xl border">
        <!-- Result will appear here -->
      </div>

    </div>
  </div>

  <script>
    function checkEligibility() {
      const resultBox = document.getElementById('result');
      resultBox.classList.remove('hidden');
      resultBox.className = "mt-8 p-5 rounded-xl border bg-green-50 border-green-200";
      resultBox.innerHTML = `
        <h3 class="font-semibold text-green-700 text-lg mb-2">You are likely eligible!</h3>
        <p class="text-green-700 text-sm mb-4">Based on the details you provided, you have a good chance of getting loan offers.</p>
        <a href="apply.html" class="inline-block bg-blue-600 text-white px-5 py-2.5 rounded-lg text-sm font-semibold hover:bg-blue-700 transition">
          Continue to Full Application →
        </a>
      `;
    }
  </script>

</body>
</html>
