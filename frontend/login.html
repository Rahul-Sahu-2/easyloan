<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – EasyLone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .error { border-color: #ef4444 !important; }
    .error-message { color: #ef4444; font-size: 0.875rem; margin-top: 0.25rem; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Navbar -->
  <nav class="bg-white shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="homepage.html" class="text-2xl font-bold text-blue-600">EasyLone</a>
      <a href="signup.html" class="text-sm font-medium text-blue-600 hover:underline">Don't have an account? Sign Up</a>
    </div>
  </nav>

  <!-- Login Form -->
  <div class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-sm border border-gray-100 p-8">

      <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-gray-900">Welcome back</h1>
        <p class="text-gray-600 mt-2 text-sm">Login to your EasyLone account</p>
      </div>

      <!-- Google Login Button -->
      <button onclick="googleLogin()" 
        class="w-full flex items-center justify-center gap-3 border border-gray-300 rounded-lg py-3 hover:bg-gray-50 transition mb-6">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="w-5 h-5">
        <span class="font-medium text-gray-700">Continue with Google</span>
      </button>

      <!-- Divider -->
      <div class="flex items-center mb-6">
        <div class="flex-1 border-t border-gray-200"></div>
        <span class="px-4 text-sm text-gray-400">or login with</span>
        <div class="flex-1 border-t border-gray-200"></div>
      </div>

      <form id="loginForm" class="space-y-5" novalidate>
        <!-- Mobile or Email -->
        <div>
          <label class="block text-sm font-medium mb-1">Mobile Number or Email</label>
          <input type="text" id="loginId" placeholder="Enter mobile number or email"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
          <p class="error-message hidden" id="loginIdError">Please enter a valid mobile number or email</p>
        </div>

        <!-- Password -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-sm font-medium">Password</label>
            <a href="#" class="text-sm text-blue-600 hover:underline">Forgot password?</a>
          </div>
          <input type="password" id="password" placeholder="Enter your password"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
          <p class="error-message hidden" id="passwordError">Password is required (min 6 characters)</p>
        </div>

        <!-- Remember Me -->
        <div class="flex items-center gap-2">
          <input type="checkbox" id="remember" class="w-4 h-4 text-blue-600 rounded">
          <label class="text-sm text-gray-600">Remember me</label>
        </div>

        <!-- Login Button -->
        <button type="submit"
          class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition">
          Login
        </button>
      </form>

      <p class="text-center text-sm text-gray-600 mt-6">
        Don't have an account?
        <a href="signup.html" class="text-blue-600 font-medium hover:underline">Sign Up</a>
      </p>

    </div>
  </div>

  <script>
    // Google Login (Frontend only for now)
    function googleLogin() {
      alert("Google Login will work after we connect backend / Firebase.\n\nFor now this is just the button.");
      // Later: window.location.href = "your-google-oauth-url";
    }

    // Normal form validation
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      let isValid = true;

      document.querySelectorAll('.error-message').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('input').forEach(el => el.classList.remove('error'));

      const loginId = document.getElementById('loginId').value.trim();
      const password = document.getElementById('password').value;

      const isMobile = /^[0-9]{10}$/.test(loginId);
      const isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(loginId);

      if (!isMobile && !isEmail) {
        showError('loginId', 'loginIdError');
        isValid = false;
      }

      if (password.length < 6) {
        showError('password', 'passwordError');
        isValid = false;
      }

      if (isValid) {
        alert('Login successful! (Will redirect to Dashboard later)');
        // window.location.href = "dashboard.html";
      }
    });

    function showError(inputId, errorId) {
      document.getElementById(inputId).classList.add('error');
      document.getElementById(errorId).classList.remove('hidden');
    }
  </script>

</body>
</html>
